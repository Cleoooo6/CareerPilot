[project]
name = "careerpilot-backend"
version = "0.1.0"
description = "CareerPilot AI 后端（职业画像、市场洞察与成长路线）"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "langgraph>=1.2,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "alembic>=1.13,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "httpx>=0.27,<1.0",
    "pypdf>=5.1,<6.0",
    "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: 需要真实 PostgreSQL 的测试（使用独立测试库）",
    "e2e: 需要完整服务栈的测试",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "N", "I"]
ignore = ["E501"]